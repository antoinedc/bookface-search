[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookface-cli"
version = "0.1.0"
description = "CLI for YC's Bookface forum"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
bookface = "bookface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
